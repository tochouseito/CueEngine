name: CueEngine Reference Site

on:
  push:
    branches: [release]
    paths:
      - Website/**
      - .github/workflows/reference-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cue-reference-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Website
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          CUE_REQUIRE_RELEASE_CATALOG: '1'
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: Website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
