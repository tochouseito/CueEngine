name: Tagged Engine and Hub Release

on:
  push:
    tags:
      - engine-v*
      - hub-v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing engine-v or hub-v tag to publish
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cue-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}/out/dotnet-home
      NUGET_PACKAGES: ${{ github.workspace }}/out/nuget/packages
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      CUE_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          global-json-file: global.json
      - name: Validate product tag
        id: version
        run: ./Tools/Packaging/Scripts/Test-ReleaseTag.ps1 -Tag $env:CUE_RELEASE_TAG
      - name: Prepare verified DXC archive
        if: steps.version.outputs.product == 'engine'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release の直 URL に依存せず API で取得し、通常 Build と梱包 Build で同じ検証済み Archive を使う
          $definition = Get-Content -LiteralPath ThirdParty/DirectXShaderCompiler.cmake -Raw
          $version = [regex]::Match($definition, '(?m)^set\(CUE_DXC_VERSION "([^"]+)"\)\r?$').Groups[1].Value
          $expectedHash = [regex]::Match($definition, '(?m)^set\(CUE_DXC_SHA256 "([a-f0-9]{64})"\)\r?$').Groups[1].Value
          $asset = [regex]::Match($definition, 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v\$\{CUE_DXC_VERSION\}/([^"/]+\.zip)').Groups[1].Value
          if (-not $version -or -not $expectedHash -or -not $asset) { throw 'DXC release definition is missing or invalid' }
          $directory = Join-Path $env:RUNNER_TEMP 'cue-dxc'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          gh release download "v$version" --repo microsoft/DirectXShaderCompiler --pattern $asset --dir $directory --clobber
          if ($LASTEXITCODE -ne 0) { throw 'DXC API download failed' }
          $archive = Join-Path $directory $asset
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine $expectedHash) { throw 'DXC archive hash mismatch' }
          New-Item -ItemType Directory -Path ThirdParty/Packages -Force | Out-Null
          Copy-Item -LiteralPath $archive -Destination "ThirdParty/Packages/DXC-$version.zip" -Force
      - name: Prepare C++ dependencies
        if: steps.version.outputs.product == 'engine'
        run: ./scripts/prepare_dependencies.ps1
      - name: Build and test native code
        if: steps.version.outputs.product == 'engine'
        run: |
          ./scripts/codex_build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          ctest --preset windows-vs2026-debug --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed' }
      - name: Test Hub services
        run: |
          pwsh -NoProfile -File Tools/Packaging/Scripts/PackageCommonTests.ps1 -TestRoot out/package-tests
          if ($LASTEXITCODE -ne 0) { throw 'Package contract tests failed' }
          pwsh -NoProfile -File Tools/Packaging/Scripts/TaggedReleaseTests.ps1 -TestRoot out/tagged-release-tests
          if ($LASTEXITCODE -ne 0) { throw 'Tagged release tests failed' }
          dotnet restore Tools/CueHub.Tests/CueHub.Tests.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Hub restore failed' }
          dotnet run --project Tools/CueHub.Tests/CueHub.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Hub tests failed' }
          dotnet restore Tools/CueHub.UiTests/CueHub.UiTests.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Hub UI restore failed' }
          dotnet run --project Tools/CueHub.UiTests/CueHub.UiTests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Hub UI tests failed' }
      - name: Prepare package signing key
        env:
          CUE_PACKAGE_SIGNING_KEY_PEM: ${{ secrets.CUE_PACKAGE_SIGNING_KEY_PEM }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CUE_PACKAGE_SIGNING_KEY_PEM)) { throw 'Set CUE_PACKAGE_SIGNING_KEY_PEM before publishing signed packages' }
          $key = [Security.Cryptography.ECDsa]::Create()
          try {
            $key.ImportFromPem($env:CUE_PACKAGE_SIGNING_KEY_PEM)
            if ($key.KeySize -ne 256 -or $key.ExportParameters($false).Curve.Oid.Value -cne '1.2.840.10045.3.1.7') { throw 'P-256 signing key required' }
            [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'cue-signing.pem'), $key.ExportPkcs8PrivateKeyPem())
            [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'cue-publisher.pem'), $key.ExportSubjectPublicKeyInfoPem())
          } finally { $key.Dispose() }
      - name: Package Engine
        if: steps.version.outputs.product == 'engine'
        run: |
          ./Tools/Packaging/Engine/New-EnginePackage.ps1 -SigningKeyFile (Join-Path $env:RUNNER_TEMP 'cue-signing.pem') -OutputDirectory out/release
      - name: Package Hub
        if: steps.version.outputs.product == 'hub'
        run: |
          ./Tools/Packaging/Hub/New-HubPackage.ps1 -SigningKeyFile (Join-Path $env:RUNNER_TEMP 'cue-signing.pem') -TrustedPublisherKeyFile (Join-Path $env:RUNNER_TEMP 'cue-publisher.pem') -OutputDirectory out/release
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          CUE_RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $directory = if ($env:CUE_RELEASE_TAG.StartsWith('hub-v')) { 'out/release/Release' } else { 'out/release' }
          ./Tools/Packaging/Scripts/Publish-TaggedRelease.ps1 -Tag $env:CUE_RELEASE_TAG -PackageDirectory $directory -Repository $env:CUE_RELEASE_REPOSITORY -PublisherPublicKeyFile (Join-Path $env:RUNNER_TEMP 'cue-publisher.pem')
      - name: Remove temporary private key
        if: always()
        run: |
          $keyFile = Join-Path $env:RUNNER_TEMP 'cue-signing.pem'
          if (Test-Path -LiteralPath $keyFile) { Remove-Item -LiteralPath $keyFile -Force }

  refresh-downloads:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Refresh signed Engine and Hub download catalogs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run reference-site.yml --ref release
